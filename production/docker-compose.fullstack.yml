services:

  # ── PostgreSQL + 3DCityDB v5 with SFCGAL ───────────────────────────────────
  #    Default parameters are tuned for better performance with large datasets.
  postgres:
    image: khaoulakanna1/3dcitydb-v5-docker-sfcgal-patched:latest
    ports:
      - "5432:5432" 
    shm_size: '2gb'
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=512MB
      -c work_mem=512MB
      -c max_wal_size=4GB
      -c random_page_cost=1.1    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citydb}
      POSTGRES_USER: ${POSTGRES_USER:-citydb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citydb}
      SRID: ${SRID:-25832}
      SRS_NAME: "urn:ogc:def:crs:EPSG::${SRID:-25832}"
      POSTGIS_SFCGAL: ${POSTGIS_SFCGAL:-true}
    volumes:
      - citydb-data:/var/lib/postgresql
    networks:
      - citydb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citydb} -d ${POSTGRES_DB:-citydb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Gradio chat UI + importer ──────────────────────────────────────────────
  citydb-agent:
    image: khaoulakanna1/citydb-mcp-agent:latest
    # build: section kept for local builds (see README for Windows note).
    # Context is the repo root so the Dockerfile can COPY both production/webui
    # and src/citydb_mcp into the image.
    build:
      context: ..
      dockerfile: production/docker/Dockerfile
    env_file:
      - .env
    environment:
      - CITYDB_MCP_VARIANT=fullstack
      - DATABASE_URL=postgresql://${POSTGRES_USER:-citydb}:${POSTGRES_PASSWORD:-citydb}@postgres:5432/${POSTGRES_DB:-citydb}
      - CITYDB_HOST=postgres
      - CITYDB_PORT=5432
      - CITYDB_NAME=${POSTGRES_DB:-citydb}
      - CITYDB_USER=${POSTGRES_USER:-citydb}
      - CITYDB_PASSWORD=${POSTGRES_PASSWORD:-citydb}
      - CITYDB_SCHEMA=${CITYDB_SCHEMA:-citydb}
      # CITYDB_DOCKER_NETWORK / CITYDB_HOST_DATA_DIR are auto-detected from the
      # running container; set them only if you need to override the defaults.
      # Expose the MCP server over SSE/HTTP on port 8080 (endpoint: /sse) so
      # external MCP clients (e.g. VS Code) can connect without a local process.
      - CITYDB_MCP_SSE=1
      - MCP_SSE_HOST=0.0.0.0
      - MCP_SSE_PORT=8080
    ports:
      - "7860:7860"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Docker socket — needed so Gradio can launch the citydb-tool container
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - citydb-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    user: root

  # ── Import helper images (pre-pull only) ────────────────────────────────────
  # citydb-tool and ifc-to-citygml3 are launched on demand as sibling
  # containers by production/webui/importer.py via the Docker socket — `docker
  # compose up` never starts these two. They exist only so their (large)
  # images can be pre-pulled ahead of time with a normal `docker pull`
  # progress bar, instead of the first import/conversion silently blocking
  # for several minutes inside the Gradio import log. See README's Quick
  # Start for the two `--profile ... pull` commands.
  citydb-tool:
    image: ghcr.io/3dcitydb/citydb-tool:latest
    profiles: ["importer"]
    entrypoint: ["true"]
    restart: "no"
    pull_policy: missing

  ifc-to-citygml3:
    image: ghcr.io/tum-gis/ifc-to-citygml3:latest
    profiles: ["ifc"]
    entrypoint: ["true"]
    restart: "no"
    pull_policy: missing

networks:
  citydb-net:

volumes:
  citydb-data:
